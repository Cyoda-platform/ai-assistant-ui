      <svg viewBox="0 0 1440 720" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cy-title cy-desc">
        <title id="cy-title">Cyoda Cloud hero background</title>
        <desc id="cy-desc">Subtle architectural background for the Cyoda Cloud hero, showing hosted runtime boundaries, API connectivity, event flow, and traceable history around the real workflow editor.</desc>

        <defs>
          <pattern id="cyGridMinor" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
            <path d="M32 0 L0 0 0 32" stroke="#E2E8F0" stroke-width="1" fill="none"/>
          </pattern>
          <pattern id="cyGridMajor" x="0" y="0" width="160" height="160" patternUnits="userSpaceOnUse">
            <path d="M160 0 L0 0 0 160" stroke="#CBD5E1" stroke-width="1" fill="none"/>
          </pattern>
          <pattern id="cyDotField" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
            <circle cx="16" cy="16" r="0.9" fill="#CBD5E1"/>
          </pattern>

          <!-- Faint dashed boundary stroke -->
          <pattern id="cyMicroTicks" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
            <line x1="0" y1="3" x2="3" y2="3" stroke="#94A3B8" stroke-width="0.6"/>
          </pattern>

          <!-- Left fade so background recedes under hero copy -->
          <linearGradient id="cyLeftFade" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92"/>
            <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
          </linearGradient>

          <!-- Soft right-side fade to history field -->
          <linearGradient id="cyRightFade" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
            <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.6"/>
          </linearGradient>

          <!-- Glow for accent path -->
          <linearGradient id="cyAccentLine" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%"  stop-color="#2563EB" stop-opacity="0"/>
            <stop offset="20%" stop-color="#2563EB" stop-opacity="0.55"/>
            <stop offset="80%" stop-color="#2563EB" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
          </linearGradient>

          <linearGradient id="cySoftLine" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%"  stop-color="#94A3B8" stop-opacity="0"/>
            <stop offset="50%" stop-color="#94A3B8" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#94A3B8" stop-opacity="0"/>
          </linearGradient>
        </defs>

        <!-- =========== Layer 1: base + grids =========== -->
        <g id="cy-bg">
          <rect x="0" y="0" width="1440" height="720" fill="#F8FAFC"/>
          <rect x="0" y="0" width="1440" height="720" fill="url(#cyGridMinor)" opacity="0.55"/>
          <rect x="0" y="0" width="1440" height="720" fill="url(#cyGridMajor)" opacity="0.45"/>
        </g>

        <!-- =========== Layer 2: large runtime boundary (right + center) =========== -->
        <g id="cy-runtime-boundary" opacity="0.85">
          <!-- outer boundary, very faint -->
          <rect x="640" y="120" width="640" height="480" rx="20" fill="none" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="2 5"/>
          <!-- inner boundary -->
          <rect x="688" y="160" width="544" height="400" rx="14" fill="none" stroke="#E2E8F0" stroke-width="1"/>
          <!-- corner ticks (architectural) -->
          <g stroke="#94A3B8" stroke-width="1" fill="none" opacity="0.7">
            <path d="M640 140 L640 120 L660 120"/>
            <path d="M1280 120 L1280 140"/>
            <path d="M1260 120 L1280 120"/>
            <path d="M640 580 L640 600 L660 600"/>
            <path d="M1280 600 L1280 580"/>
            <path d="M1260 600 L1280 600"/>
          </g>
        </g>

        <!-- =========== Layer 3: secondary node-field boundary (left, where client services live conceptually) =========== -->
        <g id="cy-client-boundary" opacity="0.7">
          <rect x="120" y="240" width="380" height="240" rx="16" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 4"/>
          <!-- crosshair anchor -->
          <g stroke="#94A3B8" stroke-width="0.8" fill="none" opacity="0.6">
            <line x1="300" y1="352" x2="320" y2="352"/>
            <line x1="310" y1="342" x2="310" y2="362"/>
            <circle cx="310" cy="352" r="3" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
          </g>
        </g>

        <!-- =========== Layer 4: dot-field cluster inside runtime (suggests density) =========== -->
        <g id="cy-dotfield" opacity="0.55">
          <rect x="688" y="160" width="544" height="400" fill="url(#cyDotField)"/>
        </g>

        <!-- =========== Layer 5: faint event paths (curves from left → runtime → right history) =========== -->
        <g id="cy-event-paths" fill="none">
          <!-- soft baseline curves -->
          <path d="M -20 380 C 220 380, 320 300, 500 300 C 640 300, 700 360, 860 360 C 1020 360, 1100 280, 1280 280 C 1380 280, 1460 280, 1460 280"
                stroke="url(#cySoftLine)" stroke-width="1" opacity="0.55"/>
          <path d="M -20 460 C 240 460, 340 520, 520 480 C 700 440, 760 480, 920 460 C 1080 440, 1180 500, 1380 500"
                stroke="url(#cySoftLine)" stroke-width="1" opacity="0.45"/>
          <path d="M -20 240 C 200 240, 320 220, 540 240 C 740 258, 820 200, 1000 200 C 1180 200, 1300 220, 1460 220"
                stroke="url(#cySoftLine)" stroke-width="1" opacity="0.35"/>

          <!-- accent main flow -->
          <path id="cy-mainflow"
                d="M 200 360 C 380 360, 460 360, 560 360 C 660 360, 700 320, 820 320 C 940 320, 1000 400, 1140 400 C 1240 400, 1300 400, 1380 400"
                stroke="url(#cyAccentLine)" stroke-width="1.6"/>

          <!-- tiny perpendicular ticks along the accent flow (like sampling marks) -->
          <g stroke="#2563EB" stroke-width="1" opacity="0.45">
            <line x1="280" y1="354" x2="280" y2="366"/>
            <line x1="380" y1="354" x2="380" y2="366"/>
            <line x1="500" y1="354" x2="500" y2="366"/>
            <line x1="600" y1="334" x2="600" y2="346"/>
            <line x1="720" y1="314" x2="720" y2="326"/>
            <line x1="820" y1="314" x2="820" y2="326"/>
            <line x1="940" y1="364" x2="940" y2="376"/>
            <line x1="1060" y1="394" x2="1060" y2="406"/>
            <line x1="1180" y1="394" x2="1180" y2="406"/>
            <line x1="1300" y1="394" x2="1300" y2="406"/>
          </g>

          <!-- a few small accent dots at junction points (no labels) -->
          <g>
            <circle cx="500" cy="360" r="3" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
            <circle cx="820" cy="320" r="3" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
            <circle cx="1140" cy="400" r="3" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
          </g>
        </g>

        <!-- =========== Layer 6: branch lines (transition geometry hints) =========== -->
        <g id="cy-branches" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.7">
          <!-- branch up -->
          <path d="M820 320 C 820 260, 880 220, 960 220"/>
          <!-- branch down -->
          <path d="M820 320 C 820 380, 880 440, 960 440"/>
          <!-- small loop-back arc -->
          <path d="M1060 400 C 1060 480, 940 480, 940 440" stroke-dasharray="3 3"/>
          <!-- ghost branch from left zone -->
          <path d="M310 352 C 380 352, 420 320, 500 320"/>
        </g>

        <!-- =========== Layer 7: trace / history tick marks (right side) =========== -->
        <g id="cy-trace" opacity="0.85">
          <!-- vertical ledger axis -->
          <line x1="1320" y1="170" x2="1320" y2="600" stroke="#E2E8F0" stroke-width="1"/>
          <!-- tick rows -->
          <g stroke="#94A3B8" stroke-width="1">
            <line x1="1314" y1="200" x2="1326" y2="200"/>
            <line x1="1314" y1="232" x2="1326" y2="232"/>
            <line x1="1314" y1="264" x2="1326" y2="264"/>
            <line x1="1314" y1="296" x2="1326" y2="296"/>
            <line x1="1314" y1="328" x2="1326" y2="328"/>
            <line x1="1314" y1="360" x2="1326" y2="360"/>
            <line x1="1314" y1="392" x2="1326" y2="392"/>
            <line x1="1314" y1="424" x2="1326" y2="424"/>
            <line x1="1314" y1="456" x2="1326" y2="456"/>
            <line x1="1314" y1="488" x2="1326" y2="488"/>
            <line x1="1314" y1="520" x2="1326" y2="520"/>
            <line x1="1314" y1="552" x2="1326" y2="552"/>
            <line x1="1314" y1="584" x2="1326" y2="584"/>
          </g>
          <!-- abstract ledger rows: thin lines + a small dot per row -->
          <g>
            <g transform="translate(1090,196)"><line x1="0" y1="4" x2="210" y2="4" stroke="#E2E8F0"/><circle cx="-6" cy="4" r="2" fill="#CBD5E1"/></g>
            <g transform="translate(1090,228)"><line x1="0" y1="4" x2="190" y2="4" stroke="#E2E8F0"/><circle cx="-6" cy="4" r="2" fill="#2563EB"/></g>
            <g transform="translate(1090,260)"><line x1="0" y1="4" x2="220" y2="4" stroke="#E2E8F0"/><circle cx="-6" cy="4" r="2" fill="#CBD5E1"/></g>
            <g transform="translate(1090,292)"><line x1="0" y1="4" x2="170" y2="4" stroke="#E2E8F0"/><circle cx="-6" cy="4" r="2" fill="#CBD5E1"/></g>
            <g transform="translate(1090,324)"><line x1="0" y1="4" x2="200" y2="4" stroke="#E2E8F0"/><circle cx="-6" cy="4" r="2" fill="#2563EB"/></g>
            <g transform="translate(1090,356)"><line x1="0" y1="4" x2="180" y2="4" stroke="#E2E8F0"/><circle cx="-6" cy="4" r="2" fill="#CBD5E1"/></g>
            <g transform="translate(1090,388)"><line x1="0" y1="4" x2="220" y2="4" stroke="#E2E8F0"/><circle cx="-6" cy="4" r="2" fill="#CBD5E1"/></g>
            <g transform="translate(1090,420)"><line x1="0" y1="4" x2="160" y2="4" stroke="#E2E8F0"/><circle cx="-6" cy="4" r="2" fill="#CBD5E1"/></g>
            <g transform="translate(1090,452)"><line x1="0" y1="4" x2="200" y2="4" stroke="#E2E8F0"/><circle cx="-6" cy="4" r="2" fill="#2563EB"/></g>
            <g transform="translate(1090,484)"><line x1="0" y1="4" x2="180" y2="4" stroke="#E2E8F0"/><circle cx="-6" cy="4" r="2" fill="#CBD5E1"/></g>
            <g transform="translate(1090,516)"><line x1="0" y1="4" x2="210" y2="4" stroke="#E2E8F0"/><circle cx="-6" cy="4" r="2" fill="#CBD5E1"/></g>
            <g transform="translate(1090,548)"><line x1="0" y1="4" x2="170" y2="4" stroke="#E2E8F0"/><circle cx="-6" cy="4" r="2" fill="#CBD5E1"/></g>
            <g transform="translate(1090,580)"><line x1="0" y1="4" x2="200" y2="4" stroke="#E2E8F0"/><circle cx="-6" cy="4" r="2" fill="#CBD5E1"/></g>
          </g>
        </g>

        <!-- =========== Layer 8: corner registration marks =========== -->
        <g id="cy-regmarks" stroke="#94A3B8" stroke-width="1" fill="none" opacity="0.55">
          <!-- top-left -->
          <path d="M40 60 L40 40 L60 40"/>
          <!-- top-right -->
          <path d="M1380 40 L1400 40 L1400 60"/>
          <!-- bottom-left -->
          <path d="M40 660 L40 680 L60 680"/>
          <!-- bottom-right -->
          <path d="M1380 680 L1400 680 L1400 660"/>
        </g>

        <!-- =========== Layer 9: subtle horizontal rule baselines (architectural) =========== -->
        <g id="cy-baselines" opacity="0.5">
          <line x1="0" y1="120" x2="1440" y2="120" stroke="#E2E8F0" stroke-width="1"/>
          <line x1="0" y1="600" x2="1440" y2="600" stroke="#E2E8F0" stroke-width="1"/>
        </g>

        <!-- =========== Layer 10: right-edge fade =========== -->
        <rect x="1180" y="0" width="260" height="720" fill="url(#cyRightFade)"/>

        <!-- =========== Layer 11: left fade so hero copy area is calm (always last among bg layers) =========== -->
        <rect x="0" y="0" width="820" height="720" fill="url(#cyLeftFade)"/>
      </svg>
